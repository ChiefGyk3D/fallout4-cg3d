; Fallout4Prefs.ini tuning — RTX 5070 Ti / 5950X / 64 GB. STATUS: TESTING / YMMV
; Target: <compatdata>/377160/pfx/drive_c/users/steamuser/Documents/My Games/Fallout4/Fallout4Prefs.ini
; MERGE these keys into the existing sections (do not append duplicate sections).
; Run the vanilla launcher ONCE first so the file exists, then never again: it
; rewrites Prefs. Values are the Ultra launcher preset + BethINI Pie "Ultra"
; where they go beyond it, per The Midnight Ride's guidance.

[Display]
; --- Shadows (the biggest visible upgrade over the launcher's Ultra) ---
fDirShadowDistance=20000.0000
fShadowDistance=20000.0000
iShadowMapResolution=4096
uiShadowFilter=3
uiOrthoShadowFilter=3
iDirShadowSplits=3
fBlendSplitDirShadow=512.0000
; --- Godrays: 3 = Ultra (tessellation-heavy; use 2 if the cost annoys you) ---
bVolumetricLightingEnable=1
iVolumetricLightingQuality=3
; --- Textures / filtering / AA ---
iMaxAnisotropy=16
sAntiAliasing=TAA
bSAOEnable=1
bEnableWetnessMaterials=1
uMaxDecals=1000
; --- LOD fade distances (Ultra) ---
fMeshLODLevel2FadeTreeDistance=6000.0000
fMeshLODLevel1FadeTreeDistance=2800.0000
fMeshLODLevel2FadeDist=2000.0000
fMeshLODLevel1FadeDist=3600.0000
; --- Window mode: borderless behaves best under Proton ---
bBorderless=1
bFull Screen=0
bTopMostWindow=0
; --- VSync stays ON here; High FPS Physics Fix takes it over (see HighFPSPhysicsFix.ini) ---
iPresentInterval=1
iVSyncPresentInterval=1

[NVHBAO]
; HBAO+ (launcher "Ambient Occlusion"). Unconfirmed under DXVK; toggle off if it artifacts.
bEnable=1

[NVFlex]
; WEAPON DEBRIS OFF. NVIDIA FleX crashes on every Turing-or-newer GPU, 50-series included.
bNVFlexEnable=0

[Launcher]
bEnableFileSelection=1
