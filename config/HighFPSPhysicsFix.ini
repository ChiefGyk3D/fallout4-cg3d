; High FPS Physics Fix — recommended values (The Midnight Ride). STATUS: TESTING / YMMV
; Target: Data/F4SE/Plugins/HighFPSPhysicsFix.ini (ships with the mod; merge these keys)
; This mod OWNS the frame cap and vsync. Do not use MangoHud / DXVK_FRAME_RATE limiters.

[Limiter]
; Set InGameFPS to your monitor's refresh rate (or TMR's calculator value).
InGameFPS=144
PipBoyFPS=60
LoadingScreenFPS=350
; Physics budget must follow the cap when it is above 60
DynamicUpdateBudget=true
BudgetMaxFPS=144

[Display]
EnableVSync=true
VSyncPresentInterval=1
AllowTearing=true

[Loading]
DisableBlackLoadingScreens=true
PostloadingMenuSpeed=2
; TMR sets this false; the mod's default is true. Try false first.
OneThreadWhileLoading=false

[Fixes]
FixPapyrusSpeed=true
